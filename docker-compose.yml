services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: voitkus
      MYSQL_USER: voitkus
      MYSQL_PASSWORD: voitkus
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: voitkus
      WORDPRESS_DB_PASSWORD: voitkus
      WORDPRESS_DB_NAME: voitkus
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./voitkus:/var/www/html/wp-content/themes/voitkus

volumes:
  db_data:
  wp_data:
